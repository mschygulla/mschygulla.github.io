{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Content }}<div class="page-intro">{{ . }}</div>{{- end }}
</header>
<div class="post-list">
  {{- range .Pages.ByDate.Reverse }}
  <article class="post-card">
    <div class="post-meta">
      <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02, 2006" }}</time>
    </div>
    <h2 class="post-title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
    {{- with .Summary }}<p class="post-summary">{{ . }}</p>{{- end }}
    <a href="{{ .RelPermalink }}" class="read-more">Read more &rarr;</a>
  </article>
  {{- end }}
</div>
{{ end }}
